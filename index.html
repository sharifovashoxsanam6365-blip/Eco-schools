<!DOCTYPE html>
<html>
<head>
    <title>Eco-Schools Platformasi</title>
</head>
<body style="background-color: #1a1a1a; color: #ffffff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div id="status">Ulanmoqda...</div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = "https://yyxorsezjrootxnrjodu.supabase.co";
        const SUPABASE_KEY = "sb_publishable_aaBrjg81DoSmfZY8wrREIg_I6XokBl8";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadSchoolData() {
            const statusDiv = document.getElementById('status');
            
            try {
                // Jadval nomi 'maktablar' ga to'g'rilandi
                const { data, error } = await supabase
                    .from('maktablar')
                    .select('*')
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0) {
                    statusDiv.innerHTML = "Muvaffaqiyatli ulandi! Ma'lumot topildi.";
                } else {
                    statusDiv.innerHTML = "Ulandi, lekin jadval bo'sh.";
                }
            } catch (err) {
                statusDiv.innerHTML = "Xatolik: " + err.message;
            }
        }

        loadSchoolData();
    </script>
</body>
</html>
